[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "biomecha-rag"
version = "0.1.0"
description = "Hybrid BGE plus BM25 retrieval with cross-encoder reranking and Mistral-7B generation for sports biomechanics notes."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Md Tarek Islam" }]
dependencies = [
    "requests>=2.31",
    "rank-bm25>=0.2.2",
    "langchain-core>=0.3,<2",
    "langchain-huggingface>=0.1.2",
    "pinecone>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
biomecha-rag = "biomecha_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B905"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["biomecha_rag"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", "terraform", ".venv"]
