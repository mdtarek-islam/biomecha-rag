<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="t d">
  <title id="t">POST /ask request lifecycle</title>
  <desc id="d">Sequence from client to API Gateway and the Lambda handler: validate, hybrid retrieve, rerank, generate, cite and return 200. Bad input returns 400. Any other failure returns 500.</desc>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; font-size: 12px; }
    .s { fill: #8b949e; }
    .h { font-size: 15px; font-weight: 600; }
    .b { font-size: 13px; }
    .n { fill: #161b22; stroke: #30363d; stroke-width: 1; }
    .l { fill: none; stroke: #30363d; stroke-width: 1; stroke-dasharray: 3 5; }
    .f { fill: none; stroke: #58a6ff; stroke-width: 1.5; stroke-dasharray: 6 8; animation: dash 1.6s linear infinite; }
    .o { fill: none; stroke: #3fb950; stroke-width: 1.5; stroke-dasharray: 6 8; animation: dash 1.6s linear infinite; }
    .e { fill: none; stroke: #f85149; stroke-width: 1.5; stroke-dasharray: 6 8; animation: dash 1.6s linear infinite; }
    .r { fill: #f85149; }
    .d1 { animation-delay: .15s; } .d2 { animation-delay: .3s; } .d3 { animation-delay: .45s; } .d4 { animation-delay: .6s; } .d5 { animation-delay: .75s; } .d6 { animation-delay: .9s; } .d7 { animation-delay: 1.05s; } .d8 { animation-delay: 1.2s; }
    @keyframes dash { to { stroke-dashoffset: -28; } }
    @media (prefers-reduced-motion: reduce) { .f, .o, .e { animation: none; } }
  </style>
  <defs>
    <marker id="ma" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#58a6ff"/></marker>
    <marker id="mg" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3fb950"/></marker>
    <marker id="mr" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#f85149"/></marker>
  </defs>
  <rect width="960" height="640" fill="#0d1117"/>
  <text x="30" y="30" class="h">POST /ask request lifecycle</text>

  <rect class="n" x="30" y="50" width="120" height="40" rx="6"/><text x="90" y="75" text-anchor="middle" class="b">Client</text>
  <rect class="n" x="180" y="50" width="120" height="40" rx="6"/><text x="240" y="75" text-anchor="middle" class="b">API Gateway</text>
  <rect class="n" x="330" y="50" width="120" height="40" rx="6" style="stroke:#58a6ff"/><text x="390" y="75" text-anchor="middle" class="b">lambda_handler</text>
  <rect class="n" x="480" y="50" width="120" height="40" rx="6"/><text x="540" y="75" text-anchor="middle" class="b">Retriever</text>
  <rect class="n" x="630" y="50" width="120" height="40" rx="6"/><text x="690" y="75" text-anchor="middle" class="b">Reranker</text>
  <rect class="n" x="780" y="50" width="120" height="40" rx="6"/><text x="840" y="75" text-anchor="middle" class="b">Generator</text>

  <path class="l" d="M90 90 V610"/><path class="l" d="M240 90 V610"/><path class="l" d="M390 90 V610"/>
  <path class="l" d="M540 90 V610"/><path class="l" d="M690 90 V610"/><path class="l" d="M840 90 V610"/>

  <text x="165" y="123" text-anchor="middle">POST /ask</text>
  <path class="f" d="M90 130 H240" marker-end="url(#ma)"/>
  <text x="315" y="153" text-anchor="middle">route to handler</text>
  <path class="f d1" d="M240 160 H390" marker-end="url(#ma)"/>

  <path class="f d2" d="M390 190 H430 V212 H390" marker-end="url(#ma)"/>
  <text x="440" y="205" class="s">validate JSON, question, top_n</text>

  <rect x="60" y="232" width="360" height="62" rx="6" fill="none" stroke="#f85149" stroke-width="1"/>
  <text x="70" y="248" class="r">Error path: invalid input</text>
  <text x="315" y="267" text-anchor="middle">400 with message</text>
  <path class="e d3" d="M390 274 H240" marker-end="url(#mr)"/>
  <text x="165" y="286" text-anchor="middle">400</text>
  <path class="e d3" d="M240 290 H90" marker-end="url(#mr)"/>

  <text x="465" y="323" text-anchor="middle">hybrid query, alpha-scaled</text>
  <path class="f d3" d="M390 330 H540" marker-end="url(#ma)"/>
  <text x="465" y="353" text-anchor="middle">top_k candidates</text>
  <path class="f d4" d="M540 360 H390" marker-end="url(#ma)"/>

  <text x="540" y="393" text-anchor="middle">rerank candidates</text>
  <path class="f d5" d="M390 400 H690" marker-end="url(#ma)"/>
  <text x="540" y="423" text-anchor="middle">top_n chunks</text>
  <path class="f d5" d="M690 430 H390" marker-end="url(#ma)"/>

  <text x="615" y="463" text-anchor="middle">prompt with chunks</text>
  <path class="f d6" d="M390 470 H840" marker-end="url(#ma)"/>
  <text x="615" y="493" text-anchor="middle">answer</text>
  <path class="f d6" d="M840 500 H390" marker-end="url(#ma)"/>

  <path class="f d7" d="M390 516 H430 V536 H390" marker-end="url(#ma)"/>
  <text x="440" y="531" class="s">cite: citations, context_ids</text>

  <text x="315" y="561" text-anchor="middle">200 answer, citations, context_ids</text>
  <path class="o d8" d="M390 568 H240" marker-end="url(#mg)"/>
  <path class="o d8" d="M240 568 H90" marker-end="url(#mg)"/>

  <rect x="520" y="548" width="410" height="52" rx="6" fill="none" stroke="#f85149" stroke-width="1"/>
  <text x="530" y="564" class="r">Error path: any other exception</text>
  <text x="530" y="584">Handler returns a generic 500 and hides the detail.</text>
</svg>
